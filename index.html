<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ワンピカ相場チャート</title>

 // LINEのアプリ内ブラウザは標準ブラウザで開き直す（LINE公式の仕組み）

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{color-scheme:light;
  --bg:#f4f1ea; --panel:#fff; --ink:#1b1915; --sub:#6b6458; --line:#e5ded2;
  --navy:#17324f; --navy2:#22476e; --gold:#d4a237; --red:#b3261e;
  --up:#c62f2f; --down:#1f62b8; --upbg:#fdecea; --downbg:#e8f0fb;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding-bottom:70px}
a{color:inherit}
button{font:inherit;cursor:pointer;color:var(--ink)}
input,select,textarea{color:var(--ink);background:#fff}
/* header */
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 0 var(--gold)}
.hwrap{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;text-decoration:none;white-space:nowrap}
.logo .mk{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#f1d18a);color:var(--navy);display:grid;place-items:center;font-size:16px;transform:rotate(-6deg)}
.logo small{font-size:10px;font-weight:500;opacity:.7;display:block;line-height:1}
nav.top{display:flex;gap:2px}
nav.top a{text-decoration:none;padding:7px 11px;border-radius:7px;font-size:13px;font-weight:700;opacity:.85}
nav.top a.on,nav.top a:hover{background:rgba(255,255,255,.12);opacity:1}
.hsearch{margin-left:auto;flex:0 1 260px}
.hsearch input{width:100%;border:0;border-radius:18px;padding:8px 14px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
/* bottom nav */
nav.bottom{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;text-align:center;text-decoration:none;font-size:10px;color:var(--sub);padding:7px 0 6px;font-weight:700}
nav.bottom a .ic{display:block;font-size:18px;line-height:1.2}
nav.bottom a.on{color:var(--navy)}
nav.bottom a.on .ic{color:var(--red)}
main{max-width:1120px;margin:0 auto;padding:16px}
h1.pt{font-size:22px;margin:4px 0 2px;font-weight:900}
p.lead{color:var(--sub);margin:0 0 14px;font-size:13px}
.banner{background:#fff8e6;border:1px solid #efd9a2;border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 14px}
.foot{font-size:11px;color:var(--sub)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
/* home blocks */
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.block{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bh{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.bh h2{font-size:15px;margin:0;font-weight:900}
.bh .src{font-size:10px;background:#f0ebe1;color:var(--sub);border-radius:10px;padding:2px 8px;font-weight:700}
.bh .more{margin-left:auto;font-size:12px;color:var(--navy2);text-decoration:none;font-weight:700}
.mini{display:grid;grid-template-columns:22px 34px 1fr auto;gap:9px;align-items:center;padding:8px 14px;border-bottom:1px solid #f2ede4;text-decoration:none;cursor:pointer}
.mini:last-child{border-bottom:0}
.mini:hover{background:#faf7f1}
.rk{font-weight:900;color:var(--sub);text-align:center;font-size:13px}
.rk.r1{color:#c99a2e}.rk.r2{color:#8f99a3}.rk.r3{color:#a86b3c}
.mini .nm{font-size:13px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mini .sub{font-size:10px;color:var(--sub)}
.mini .pr{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:2px}
.badge.up{background:var(--upbg);color:var(--up)}.badge.down{background:var(--downbg);color:var(--down)}.badge.flat{background:#f0ebe1;color:var(--sub)}
.empty{padding:22px;text-align:center;color:var(--sub);font-size:13px}
/* thumb (original design, no card art) */
.th{position:relative;border-radius:5px;overflow:hidden;color:#fff;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.th::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px)}
.th .r{position:relative;font-size:10px;letter-spacing:.02em}
.th .n{position:relative;font-size:8px;opacity:.85;margin-top:2px}
.th.sm{width:34px;height:47px}
.th.md{width:100%;aspect-ratio:63/88}.th.md .r{font-size:16px}.th.md .n{font-size:11px}
.th.lg{width:150px;aspect-ratio:63/88}.th.lg .r{font-size:22px}.th.lg .n{font-size:12px}
.th.gold{box-shadow:inset 0 0 0 2px #f0cf73}
/* list page */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font:inherit;background:#fff}
select,.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
.btn{color:var(--ink)}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.seg{display:inline-flex}.seg .btn{border-radius:0;margin-left:-1px}.seg .btn:first-child{border-radius:9px 0 0 9px}.seg .btn:last-child{border-radius:0 9px 9px 0}
.filters{display:none;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px}
.filters.open{display:flex}
.count{font-size:12px;color:var(--sub);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:6px}
.gcard:hover{box-shadow:0 4px 14px rgba(0,0,0,.07)}
.gcard .rkb{position:absolute;top:6px;left:6px;z-index:2;background:var(--navy);color:#fff;font-size:11px;font-weight:900;border-radius:10px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 5px}
.gcard .nm{font-size:13px;font-weight:700;line-height:1.3;height:2.6em;overflow:hidden}
.gcard .st{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .lbl{font-size:10px;color:var(--sub)}
.gcard .row2{display:flex;justify-content:space-between;align-items:flex-end;gap:4px}
.gcard .pv{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.lrow{display:grid;grid-template-columns:28px 34px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.lrow .nm{font-weight:700}
.lrow .st{font-size:11px;color:var(--sub)}
.lrow .pr{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:#fff;color:var(--sub);margin-right:3px}
/* detail */
.crumb{font-size:12px;color:var(--sub);margin-bottom:8px}.crumb a{text-decoration:none;color:var(--navy2)}
.dtop{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:start}
.dname{font-size:21px;font-weight:900;margin:0 0 6px;line-height:1.35}
.bigprice{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;margin:2px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}
.kv div{background:#faf7f1;border-radius:10px;padding:8px 10px}
.kv .k{font-size:11px;color:var(--sub)}.kv .v{font-weight:900;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.heart{font-size:16px}
h3.sh{font-size:15px;margin:22px 0 10px;padding-left:9px;border-left:4px solid var(--red);font-weight:900}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ctabs .btn{padding:6px 12px}
.chartwrap{position:relative;height:300px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{background:#f6f2ea;color:var(--sub);font-weight:500;font-size:12px}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rel a{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px;text-decoration:none;font-size:12px}
.rel b{display:block;font-variant-numeric:tabular-nums}
.cond{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:#eef3f8;color:var(--navy)}
.offlink{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;text-decoration:none;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700}
/* index */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:11px;color:var(--sub)}.stat .v{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
/* compare */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.slot{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:64px;background:#fff;font-size:12px;position:relative}
.slot.f{border-style:solid}
.slot .x{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--sub);font-size:16px}
.sugg{background:#fff;border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;margin-top:4px}
.sugg div{padding:8px 10px;border-bottom:1px solid #f2ede4;cursor:pointer;font-size:13px}
.sugg div:hover{background:#faf7f1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%}
.modal label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--sub)}
@media(max-width:760px){
  nav.top{display:none}
  nav.bottom{display:flex}
  .hsearch{flex:1}
  .logo small{display:none}
  .blocks{grid-template-columns:1fr}
  .dtop{grid-template-columns:96px 1fr;gap:12px}.th.lg{width:96px}.th.lg .r{font-size:15px}
  .bigprice{font-size:26px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .slots{grid-template-columns:1fr}
}
.bxt td{vertical-align:middle}.bxt tr.clk{cursor:pointer}.bxt tr.clk:hover{background:#faf6ea}.bxn{display:flex;gap:10px;align-items:center;min-width:240px}.bxt .num{text-align:right;white-space:nowrap}.th.box{box-shadow:inset 0 0 0 2px #e7c86a}

/* ===== POP アニメーション ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
@keyframes bob{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-2px)}}
@keyframes stripe{from{background-position:0 0}to{background-position:200px 0}}
@keyframes pulseUp{0%,100%{box-shadow:0 0 0 0 rgba(198,47,47,.35)}50%{box-shadow:0 0 0 4px rgba(198,47,47,0)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes heroShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes skel{from{background-position:-200px 0}to{background-position:200px 0}}
header{box-shadow:none}
header::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 40px,#f3d98f 40px 60px,var(--red) 60px 80px,var(--gold) 80px 100px);background-size:200px 3px;animation:stripe 6s linear infinite}
.logo .mk{animation:bob 3.2s ease-in-out infinite}
nav.top{position:relative;padding:3px;border-radius:999px;background:rgba(255,255,255,.07)}
nav.top a{position:relative;z-index:1;border-radius:999px;transition:color .25s,opacity .25s;opacity:.75}
nav.top a.on,nav.top a:hover{background:none!important;opacity:1}
nav.top a.on{color:var(--navy)}
nav.top .pill{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:linear-gradient(135deg,#f6dd97,var(--gold));box-shadow:0 2px 10px rgba(212,162,55,.45);transition:transform .45s cubic-bezier(.34,1.56,.64,1),width .45s cubic-bezier(.34,1.56,.64,1),opacity .2s;pointer-events:none}
nav.top.hov a.on:not(:hover){color:#fff}
nav.top.hov a:hover{color:var(--navy)}
nav.bottom a.on .ic{animation:popIn .35s ease}
#app.anim>*{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
#app.anim>*:nth-child(2){animation-delay:.05s}#app.anim>*:nth-child(3){animation-delay:.1s}#app.anim>*:nth-child(4){animation-delay:.15s}#app.anim>*:nth-child(5){animation-delay:.2s}#app.anim>*:nth-child(n+6){animation-delay:.25s}
#app.anim .blocks>.block{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
#app.anim .blocks>.block:nth-child(2){animation-delay:.06s}#app.anim .blocks>.block:nth-child(3){animation-delay:.12s}#app.anim .blocks>.block:nth-child(4){animation-delay:.18s}#app.anim .blocks>.block:nth-child(5){animation-delay:.24s}#app.anim .blocks>.block:nth-child(6){animation-delay:.3s}
.block,.panel,.stat{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.block:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(23,50,79,.12)}
.bh{background:linear-gradient(90deg,#fff 0%,#fbf6ea 100%)}
.bh h2::before{content:"";display:inline-block;width:6px;height:15px;border-radius:3px;background:linear-gradient(var(--red),var(--gold));margin-right:7px;vertical-align:-2px}
.mini,.lrow,.bxt tbody tr{transition:background .2s,transform .2s}
#app.anim .mini,#app.anim .lrow,#app.anim .bxt tbody tr{animation:slideIn .4s cubic-bezier(.2,.8,.2,1) both}
#app.anim .mini:nth-child(2),#app.anim .lrow:nth-child(2){animation-delay:.03s}#app.anim .mini:nth-child(3),#app.anim .lrow:nth-child(3){animation-delay:.06s}#app.anim .mini:nth-child(4),#app.anim .lrow:nth-child(4){animation-delay:.09s}#app.anim .mini:nth-child(5),#app.anim .lrow:nth-child(5){animation-delay:.12s}#app.anim .mini:nth-child(6),#app.anim .lrow:nth-child(6){animation-delay:.15s}#app.anim .mini:nth-child(7),#app.anim .lrow:nth-child(7){animation-delay:.18s}#app.anim .mini:nth-child(8),#app.anim .lrow:nth-child(8){animation-delay:.21s}#app.anim .mini:nth-child(9),#app.anim .lrow:nth-child(9){animation-delay:.24s}#app.anim .mini:nth-child(n+10),#app.anim .lrow:nth-child(n+10){animation-delay:.27s}
.mini:hover{transform:translateX(3px)}
.mini:hover .th,.lrow:hover .th,.rel a:hover .th{transform:rotate(-4deg) scale(1.08)}
.th{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.rk.r1,.rk.r2,.rk.r3{position:relative;margin:0 auto;overflow:hidden;width:22px;height:22px;line-height:22px;border-radius:50%;color:#fff;font-size:12px}
#app.anim .rk.r1,#app.anim .rk.r2,#app.anim .rk.r3{animation:popIn .5s ease both;animation-delay:.2s}
.rk.r1{background:linear-gradient(135deg,#e9c46a,#b8861f);box-shadow:0 2px 6px rgba(201,154,46,.5)}
.rk.r2{background:linear-gradient(135deg,#c9d1d9,#7d8792)}
.rk.r3{background:linear-gradient(135deg,#d9a273,#9a5d2e)}
.rk.r1::after,.rk.r2::after,.rk.r3::after,.th.gold::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite}
.rk.r2::after{animation-delay:.4s}.rk.r3::after{animation-delay:.8s}
.badge{transition:transform .2s}
.badge.up{animation:pulseUp 2.2s ease-in-out infinite}
.badge.up::before{content:"▲ ";font-size:8px}.badge.down::before{content:"▼ ";font-size:8px}
.btn{transition:transform .12s,background .2s,box-shadow .2s}
.btn:active{transform:scale(.94)}
.btn.on{box-shadow:0 3px 10px rgba(23,50,79,.25)}
.bigprice{background:linear-gradient(90deg,var(--navy),var(--red),var(--gold),var(--navy));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:heroShift 8s ease infinite}
.banner{position:relative;overflow:hidden}
.banner.loading{background:linear-gradient(90deg,#fff8e6 0%,#fff 50%,#fff8e6 100%);background-size:400px 100%;animation:skel 1.2s linear infinite}
@keyframes blobA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,20px) scale(1.15)}}
@keyframes blobB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-15px) scale(.9)}}
@keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes scaleXIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeInX{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.logo{animation:fadeInX .45s ease both}
.hero{position:relative;overflow:hidden;text-align:center;padding:30px 16px 22px;margin:-16px -16px 18px;isolation:isolate}
.hero .blob{position:absolute;border-radius:50%;filter:blur(48px);opacity:.45;z-index:-1}
.hero .bl1{width:280px;height:280px;background:#f3c96b;left:6%;top:-90px;animation:blobA 9s ease-in-out infinite}
.hero .bl2{width:240px;height:240px;background:#e7798a;right:8%;top:-40px;animation:blobB 11s ease-in-out infinite}

function thumbD(c,size){const red=/レッド/.test(c.name),gold=c.ver==="sp";const base=red?"#a3161b":RAR_COLOR[c.r2]||"#4a5568";
  return `<div class="th ${size} ${gold?"gold":""}" style="background:linear-gradient(155deg,${base},${gold?"#c99a2e":"#0c1726"})"><span class="r">${esc(c.rar)}</span><span class="n">${esc(c.id)}</span></div>`;}
const crUrl=c=>{const id=cur(c,"ci");return id?"https://www.cardrush-op.jp/product/"+id:(/^(OP|ST|EB|PRB|P)\d*-\d{3}$/.test(c.id)?"https://www.cardrush-op.jp/product-list?keyword="+encodeURIComponent(c.id):"https://www.cardrush-op.jp/")};
const crLink=(c,f)=>{const id=cur(c,f);return id?"https://www.cardrush-op.jp/product/"+id:crSearch(c)};

function statusNote(){

function movePill(a){const nt=document.getElementById("ntop"),p=nt.querySelector(".pill");if(!p)return;if(!a||!a.offsetWidth){p.style.opacity=0;return}

const SORTS={
  priceHigh:{l:"価格が高い順",v:c=>price(c),d:-1},
  priceLow:{l:"価格が安い順",v:c=>price(c),d:1},
  rise7:{l:"高騰順（7日）",v:c=>chg(c,"cm",7)?.pct,d:-1,show:c=>pctBadge(chg(c,"cm",7)),nz:1},
  fall7:{l:"下落順（7日）",v:c=>chg(c,"cm",7)?.pct,d:1,show:c=>pctBadge(chg(c,"cm",7)),nz:1},
  rise30:{l:"高騰順（30日）",v:c=>chg(c,"cm",30)?.pct,d:-1,show:c=>pctBadge(chg(c,"cm",30)),nz:1},
  fall30:{l:"下落順（30日）",v:c=>chg(c,"cm",30)?.pct,d:1,show:c=>pctBadge(chg(c,"cm",30)),nz:1},
  buyHigh:{l:"買取価格が高い順",v:c=>cur(c,"mb"),d:-1,show:c=>`<span class="badge flat">買取 ${yen(cur(c,"mb"))}</span>`},
  buyRise7:{l:"買取高騰順（7日）",v:c=>chg(c,"mb",7)?.pct,d:-1,show:c=>pctBadge(chg(c,"mb",7)),nz:1},
  stockRise:{l:"在庫増加順（カードラッシュ）",v:c=>chg(c,"cs",7)?.diff,d:-1,show:c=>pctBadge(chg(c,"cs",7),"個"),nz:1},
  stockFall:{l:"在庫減少順（カードラッシュ）",v:c=>chg(c,"cs",7)?.diff,d:1,show:c=>pctBadge(chg(c,"cs",7),"個"),nz:1},
  stockMany:{l:"在庫の多い順（カードラッシュ）",v:c=>cur(c,"cs"),d:-1,show:c=>`<span class="badge flat">在庫 ${cur(c,"cs")??"—"}枚</span>`},
  stockFew:{l:"在庫の少ない順（カードラッシュ）",v:c=>cur(c,"cs"),d:1,show:c=>`<span class="badge flat">在庫 ${cur(c,"cs")??"—"}枚</span>`},
  newest:{l:"新しい弾順",v:c=>c.porder,d:1},
  oldest:{l:"古い弾順",v:c=>c.porder,d:-1},
};
function sortedAll(list,key){const S=SORTS[key];const has=[],rest=[];list.forEach(c=>{const v=S.v(c);if(v!=null&&!(S.nz&&v===0))has.push({c,v});else rest.push(c)});has.sort((a,b)=>(a.v-b.v)*S.d);rest.sort((a,b)=>(price(b)||0)-(price(a)||0));return {list:has.map(x=>x.c).concat(rest),ranked:has.length};}
function sorted(list,key){const S=SORTS[key];return list.map(c=>({c,v:S.v(c)})).filter(x=>x.v!=null&&!(S.nz&&x.v===0)).sort((a,b)=>(a.v-b.v)*S.d).map(x=>x.c);}

function updateCards(){
  kill();
  const norm=x=>x.normalize("NFKC").toLowerCase();
  const terms=norm(LIST.q).split(/\s+/).filter(Boolean);
  let list=DATA.filter(c=>(!LIST.pack||c.pack===LIST.pack)&&(!LIST.rar||c.r2===LIST.rar)&&(!LIST.par||(LIST.par==="p"?c.ver:c.ver==="sp"))&&(!terms.length||terms.every(w=>norm(c.name+" "+c.id+" "+c.set).includes(w))));
  const sk=(loadState!=="ok"&&!["priceHigh","priceLow","newest","oldest"].includes(LIST.sort))?"priceHigh":LIST.sort;
  const r=sortedAll(list,sk);list=r.list;
  const S=SORTS[sk],shown=list.slice(0,LIST.n);
  const extra=c=>S.show?S.show(c):pctBadge(chg(c,"cm",7));
  document.getElementById("lf").classList.toggle("on",LIST.open);
  document.getElementById("lf").textContent="絞り込み"+((LIST.pack||LIST.rar||LIST.par)?" ●":"");
  document.getElementById("lfp").classList.toggle("open",LIST.open);
  app.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===LIST.view));
  const note=sk!==LIST.sort?"（価格データの読み込み後に選んだ並び順で表示されます）":(S.nz&&r.ranked<list.length?`（変動データのある${r.ranked.toLocaleString()}件を先に、残りを価格順に表示）`:"");
  const res=document.getElementById("lres");
  const act=[LIST.pack&&("収録弾："+(LIST.pack.startsWith("promo")?"":LIST.pack.toUpperCase()+" ")+PACKS[LIST.pack]),LIST.rar&&("レアリティ："+LIST.rar),LIST.par&&(LIST.par==="p"?"パラレルのみ":"スーパーパラレル等のみ")].filter(Boolean);
  res.innerHTML=`${act.length?`<div class="banner" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">絞り込み中：${act.map(esc).join(" ／ ")}<button class="btn" id="fx2" style="margin-left:auto">絞り込みを解除</button></div>`:""}<p class="count"><span class="foot" style="float:right">ページ更新：${BUILD}</span>${LIST.q?`「${esc(LIST.q)}」の検索結果：`:""}${list.length.toLocaleString()}件のカードが見つかりました${note}</p>
  ${LIST.view==="grid"
    ?`<div class="grid">${shown.map((c,i)=>`<div class="gcard" data-uid="${c.uid}"><span class="rkb">${i+1}</span>${thumb(c,"md")}<div class="nm">${esc(c.name)}</div><div class="st">${esc(c.id)} ・ ${esc(c.set)}</div><div class="lbl">現在価格</div><div class="row2"><span class="pv">${yen(price(c))}${isRef(c)?`<span class="foot">（参考）</span>`:""}</span>${extra(c)}</div></div>`).join("")}</div>`
    :shown.map((c,i)=>`<div class="lrow" data-uid="${c.uid}"><div class="rk">${i+1}</div>${thumb(c,"sm")}<div><div class="nm">${esc(c.name)}</div><div class="st"><span class="chip">${esc(c.id)}</span><span class="chip">${esc(c.rar)}</span>${esc(c.set)}</div></div><div class="pr">${yen(price(c))}${isRef(c)?`<span class="foot">（参考）</span>`:""}<br>${extra(c)}</div></div>`).join("")}
  ${!list.length?`<div class="empty">該当するカードがありません</div>`:""}

  bindCards(res);

// ================= 指数 =================
let IDX={members:[],vals:[]};
function buildIndex(){
  // 対象：最新日に販売価格がある上位100枚（遊々亭で追跡しているカードのみ）。各日の平均価格（欠けた日は直前の値で補う）
  if(!DATES.length) return;
  const cand=DATA.filter(c=>c.ki>=0&&cur(c,"cm")!=null);
  const uniq={};cand.forEach(c=>{if(!uniq[c.ki])uniq[c.ki]=c});
  const members=Object.values(uniq).sort((a,b)=>cur(b,"cm")-cur(a,"cm")).slice(0,100);
  const sers=members.map(c=>{const a=series(c,"cm").slice();let last=null;for(let i=0;i<a.length;i++){if(a[i]==null)a[i]=last;else last=a[i]}let first=a.find(v=>v!=null);return a.map(v=>v??first)});
  const vals=DATES.map((_,i)=>sers.reduce((s,a)=>s+(a[i]||0),0)/members.length);
  const base=vals[0]||1;
  IDX={members,vals,weights:members.map(c=>cur(c,"cm")/ (base))};
}
let IXR=9999;
function renderIndex(){
  const v=IDX.vals,n=v.length,last=v[n-1],ago=d=>v[Math.max(0,n-1-d)];
  const st=(k,d)=>{if(n<2)return `<div class="stat"><div class="k">${k}</div><div class="v flat">—</div></div>`;const o=ago(d),df=last-o,p=df/o*100;return `<div class="stat"><div class="k">${k}</div><div class="v ${df>=0?"up":"down"}">${df>=0?"+":""}${yen(df)}</div><div class="foot">${p>=0?"+":""}${p.toFixed(1)}%</div></div>`};
  app.innerHTML=`${statusNote()}<h1 class="pt">ワンピカ指数チャート</h1><p class="lead">販売価格が高い上位100枚の平均価格を、市場全体の動きを表す指数として毎日記録しています</p>
  ${n?`<div class="stats"><div class="stat"><div class="k">最新値（${DATES[n-1]}）</div><div class="v">${yen(last)}</div></div>${st("前日比",1)}${st("月間変動",30)}${st("年間変動",365)}</div>
  <div class="panel"><div class="ctabs"><span class="seg">${[[7,"7日"],[30,"1ヶ月"],[90,"3ヶ月"],[180,"6ヶ月"],[365,"1年"],[9999,"全期間"]].map(([d,l])=>`<button class="btn ${IXR===d?"on":""}" data-r="${d}">${l}</button>`).join("")}</span></div>
  ${n>=2?`<div class="chartwrap"><canvas id="ic"></canvas></div>`:`<div class="empty">指数チャートは2日分以上のデータがたまると表示されます</div>`}</div>
  <h3 class="sh">指数の算出対象カード（${IDX.members.length}枚）</h3>
  <div class="rel">${IDX.members.map(c=>`<a href="#card-${c.uid}">${thumb(c,"sm")}<span>${esc(c.name)}<b>${yen(cur(c,"cm"))}</b></span></a>`).join("")}</div>`
  :`<div class="panel empty">価格データの読み込み後に表示されます</div>`}`;
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{IXR=+b.dataset.r;renderIndex()});
  if(n>=2){const k=Math.min(IXR,n);charts.push(new Chart(document.getElementById("ic"),{type:"line",data:{labels:DATES.slice(-k).map(d=>d.slice(5).replace("-","/")),datasets:[{data:v.slice(-k),borderColor:"#b9a8ff",backgroundColor:"#b9a8ff22",fill:true,borderWidth:2,pointRadius:k<=31?2:0,tension:.25}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>yen(x.raw)}}},scales:{y:{ticks:{callback:v=>yen(v)},grid:{color:"rgba(255,255,255,.08)"}},x:{grid:{display:false},ticks:{maxTicksLimit:8}}}}}));}
}

let FLEAI=null,FLEAIP=null;const loadFleaItems=()=>FLEAIP||(FLEAIP=fetch("data/flea_items.json",{cache:"no-cache"}).then(r=>r.ok?r.json():{}).catch(()=>({})).then(j=>FLEAI=j));
const fleaItemUrl=(site,id)=>site==="y"?"https://paypayfleamarket.yahoo.co.jp/item/"+id:"https://jp.mercari.com/"+id;
function renderBoxDetail(key){
  const b=BYBOX[key];if(!b){location.hash="box";return}
  const p=bxPrice(b),c7=bxChg(b,0,7),c30=bxChg(b,0,30),m=bxCur(b,6),nd=DATES.length;
  const rows=[[0,1,2,"状態A"],[3,4,5,"状態A-"]];
  const rel=BOXES.filter(x=>x!==b&&x.kind===b.kind).sort((x,y)=>Math.abs(x.order-b.order)-Math.abs(y.order-b.order)).slice(0,8);
  const dv=x=>x?`<div class="v ${x.diff>=0?"up":"down"}">${(x.diff>=0?"+":"−")+yen(Math.abs(x.diff))} (${(x.pct>=0?"+":"")+x.pct.toFixed(1)}%)</div>`:`<div class="v">—</div>`;
  app.innerHTML=`${statusNote()}<div class="crumb"><a href="#home">ホーム</a> / <a href="#box">BOX相場</a> / ${esc(b.name)}</div>
  <div class="panel"><div class="dtop">${bxThumb(b,"lg")}<div>
    <h1 class="dname">${esc(b.name)}</h1><div><span class="chip">未開封BOX</span><span class="chip">${BOX_KIND[b.kind]}</span></div>
    <div class="foot" style="margin-top:10px">販売価格（カードラッシュ・状態A）</div><div class="bigprice">${yen(p)}</div>
    <div class="kv"><div><div class="k">7日間変動</div>${dv(c7)}</div><div><div class="k">30日間変動</div>${dv(c30)}</div>
      <div><div class="k">フリマ相場（テープ付き）</div><div class="v">${yen(bxCur(b,20))}</div></div>${b.kind==="pcc"||b.kind==="etc"?"":`<div><div class="k">フリマ相場（テープカット）</div><div class="v">${yen(bxCur(b,21))}</div></div>`}<div><div class="k">買取価格（メルカード）</div><div class="v">${yen(m)}</div></div><div><div class="k">買取率</div><div class="v">${p&&m?Math.round(m/p*100)+"%":"—"}</div></div></div>
  </div></div></div>
  <h3 class="sh">価格推移グラフ</h3>
  <div class="panel"><div class="ctabs">${[[0,"販売 状態A"],[3,"販売 A-"],[20,"フリマ テープ付"],[21,"フリマ テープカット"],[6,"買取"],[1,"在庫数"]].map(([i,l])=>`<button class="btn ${BXD.f===i?"on":""}" data-f="${i}">${l}</button>`).join("")}
    <span style="margin-left:auto" class="seg">${[[7,"7日"],[30,"1ヶ月"],[90,"3ヶ月"],[365,"1年"],[9999,"全期間"]].map(([d,l])=>`<button class="btn ${BXD.range===d?"on":""}" data-r="${d}">${l}</button>`).join("")}</span></div>
    ${nd>=2?`<div class="chartwrap"><canvas id="bc"></canvas></div>`:`<div class="empty">推移グラフは2日分以上のデータがたまると表示されます</div>`}</div>
  <h3 class="sh">購入・買取情報</h3>
  <div class="panel" style="padding:0;overflow:auto"><table><thead><tr><th>ショップ</th><th>種別</th><th>状態</th><th>在庫</th><th>価格</th></tr></thead><tbody>
  ${rows.map(([pi,si,ii,l])=>{const pv=bxCur(b,pi),sv=bxCur(b,si);return `<tr><td><a href="${bxLink(b,ii)}" target="_blank" rel="noopener">カードラッシュ ↗</a></td><td>販売</td><td><span class="cond">${l}</span></td><td>${pv==null?"—":sv>0?sv+"個":"なし"}</td><td>${yen(pv)}</td></tr>`}).join("")}
  <tr><td><a href="https://akihabara-cardshop.com/onepice-kaitori/" target="_blank" rel="noopener">メルカード秋葉原 ↗</a></td><td>買取</td><td>未開封</td><td>—</td><td>${yen(m)}</td></tr>
  ${[["y","Yahoo!フリマ",10,"テープ付き"],["m","メルカリ",12,"テープ付き"],["y","Yahoo!フリマ",14,"テープカット"],["m","メルカリ",16,"テープカット"]].filter(r=>r[2]<14||!(b.kind==="pcc"||b.kind==="etc")).map(([s,l,i,c])=>{const v=bxCur(b,i),n=bxCur(b,i+1);return `<tr><td><a href="${fleaUrl(s,b)}" target="_blank" rel="noopener">${l} ↗</a></td><td>売却相場</td><td><span class="cond">${b.kind==="pcc"||b.kind==="etc"?"未開封":c}</span></td><td>${n?"直近"+n+"件":"—"}</td><td>${yen(v)}</td></tr>`}).join("")}</tbody></table></div>
  ${(()=>{if(!FLEAI)return `<h3 class="sh">フリマ相場の参考にした出品</h3><div class="panel"><div class="empty">読み込み中…</div></div>`;
    const tape=!(b.kind==="pcc"||b.kind==="etc");
    const col=(site,l)=>{const it=((FLEAI[site]||{})[key])||[];return `<div class="fl"><h4>${l}</h4>${it.length?it.map(([id,p,c,t,d])=>`<a class="fli" href="${fleaItemUrl(site,id)}" target="_blank" rel="noopener nofollow"><span class="flt">${esc(t||id)}</span><span class="flm">${tape?`<span class="cond">${c?"テープカット":"テープ付き"}</span>`:""}${d?`<span class="foot">${esc(d)}</span>`:""}<b>${yen(p)}</b></span></a>`).join(""):`<div class="empty">該当なし</div>`}</div>`};
    return `<h3 class="sh">フリマ相場の参考にした出品${FLEAI.date?`<span class="foot">（${esc(FLEAI.date)} 時点・売り切れ）</span>`:""}</h3><div class="panel flp">${col("y","Yahoo!フリマ")}${col("m","メルカリ")}</div>`})()}
  <p class="foot">状態A-はカードラッシュで外箱・シュリンクに傷などがある未開封品です。売却相場は、Yahoo!フリマ・メルカリで「売り切れ」になった1BOXの出品（新しい順・最大10件）の中央値です。タイトルに「テープカット」「テープなし」などとあるものをテープカット、それ以外（「テープ付き」や記載なし）をテープ付きとして分けています。複数BOXのセット・開封済み・空箱・海外版などは除いています。</p>
  <h3 class="sh">直近の相場</h3>
  <div class="panel" style="padding:0;overflow:auto"><table><thead><tr><th>日付</th><th>販売 A</th><th>在庫</th><th>販売 A-</th><th>フリマ テープ付</th><th>フリマ カット</th><th>買取</th></tr></thead><tbody>
  ${DATES.map((d,i)=>i).reverse().filter(i=>(BXS[i]&&BXS[i][key])||(BXF[i]&&BXF[i][key])).slice(0,14).map(i=>{const a=(BXS[i]&&BXS[i][key])||[];return `<tr><td>${DATES[i]}</td><td>${yen(a[0])}</td><td>${a[1]??"—"}</td><td>${yen(a[3])}</td><td>${yen(BXF[i]&&BXF[i][key]?fleaMix(BXF[i][key]):null)}</td><td>${yen(BXF[i]&&BXF[i][key]?fleaMix(BXF[i][key],4):null)}</td><td>${yen(a[6])}</td></tr>`}).join("")||`<tr><td colspan="7">データなし</td></tr>`}
  </tbody></table></div>
  ${rel.length?`<h3 class="sh">同じ種類のBOX</h3><div class="rel">${rel.map(x=>`<a href="#bx-${x.key}">${bxThumb(x,"sm")}<span>${esc(x.name)}<b>${yen(bxPrice(x))}</b></span></a>`).join("")}</div>`:""}`;
  if(!FLEAI)loadFleaItems().then(()=>{if(location.hash==="#bx-"+key)renderBoxDetail(key)});
  app.querySelectorAll("[data-f]").forEach(e=>e.onclick=()=>{BXD.f=+e.dataset.f;renderBoxDetail(key)});
  app.querySelectorAll("[data-r]").forEach(e=>e.onclick=()=>{BXD.range=+e.dataset.r;renderBoxDetail(key)});
  if(nd>=2){const n=Math.min(BXD.range,nd),col={0:"#ff5c8a",3:"#c9b8ff",6:"#5cc8ff",1:"#6be3a8",20:"#ffd27a",21:"#ffa36b"}[BXD.f],isS=BXD.f===1;
    charts.push(new Chart(document.getElementById("bc"),{type:"line",data:{labels:DATES.slice(-n).map(d=>d.slice(5).replace("-","/")),datasets:[{data:bxSer(b,BXD.f).slice(-n),borderColor:col,backgroundColor:col+"22",fill:true,borderWidth:2,pointRadius:n<=31?2:0,tension:.25,spanGaps:true}]},
      options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>isS?x.raw+"個":yen(x.raw)}}},
      scales:{y:{ticks:{callback:v=>isS?v:v>=10000?(v/10000)+"万":v.toLocaleString()},grid:{color:"rgba(255,255,255,.08)"}},x:{grid:{display:false},ticks:{maxTicksLimit:8}}}}}));}
}

// ================= ルーティング =================
if(window.Chart){Chart.defaults.color="#a7a2c8";Chart.defaults.borderColor="rgba(255,255,255,.08)";}
let animT;
function render(){
  kill();app.classList.add("anim");clearTimeout(animT);animT=setTimeout(()=>app.classList.remove("anim"),1200);const h=location.hash.slice(1)||"home";
  const route=h.startsWith("card-")?"card":h.startsWith("bx-")?"bx":h;
  navs(route==="card"?"cards":route==="bx"?"box":route);
  if(route==="card") renderDetail(h.slice(5));
  else if(route==="cards") renderCards();
  else if(route==="index") renderIndex();
  else if(route==="compare") renderCompare();
  else if(route==="mylist") renderMylist();
  else if(route==="psa") renderPsa();
  else if(route==="box") renderBox();
  else if(route==="bx") renderBoxDetail(h.slice(3));
  else renderHome();
  countUp();
}
// 価格の数字をカウントアップ表示
function countUp(){
  if(document.documentElement.classList.contains("lite"))return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  app.querySelectorAll(".bigprice,.stat .v,.hstats .cnt").forEach(el=>{
    const m=el.textContent.match(/^([+−-]?)(¥?)([\d,]+)$/);if(!m)return;
    const to=+m[3].replace(/,/g,"");if(!to)return;const t0=performance.now(),D=700;
    const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=m[1]+m[2]+Math.round(to*e).toLocaleString("ja-JP");if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);});
}
document.getElementById("hs").onsubmit=e=>{e.preventDefault();LIST.q=document.getElementById("hq").value.trim();LIST.n=60;LIST.pack=LIST.rar=LIST.par="";if(location.hash==="#cards")render();else location.hash="cards";};
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
loadDb();

</script>
